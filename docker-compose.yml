name: codexetherium

networks:
  proxy:
    external: true
  mtg_data:
    external: true

services:
  codexetherium:
    build: .
    restart: unless-stopped
    networks:
      - proxy
      - mtg_data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.codexetherium.rule=Host(`codexetherium.${DOMAIN}`)"
      - "traefik.http.routers.codexetherium.entrypoints=web"
      - "traefik.http.services.codexetherium.loadbalancer.server.port=8000"
      - "launcher.enable=true"
      - "launcher.name=Codex Etherium"
      - "launcher.description=Search MTG cards by name, type, color, format, and more"
      - "launcher.url=https://codexetherium.${DOMAIN}"
      - "launcher.group=MTG"
      - "launcher.order=10"
